allowBuilds:
  sharp: true
  unrs-resolver: true

peerDependencyRules:
  allowAny:
    - eslint
    - typescript

packageExtensions:
  '@typescript-eslint/eslint-plugin':
    dependencies:
      typescript: npm:typescript@6.0.2
  '@typescript-eslint/parser':
    dependencies:
      typescript: npm:typescript@6.0.2
  '@typescript-eslint/project-service':
    dependencies:
      typescript: npm:typescript@6.0.2
  '@typescript-eslint/tsconfig-utils':
    dependencies:
      typescript: npm:typescript@6.0.2
  '@typescript-eslint/type-utils':
    dependencies:
      typescript: npm:typescript@6.0.2
  '@typescript-eslint/typescript-estree':
    dependencies:
      typescript: npm:typescript@6.0.2
  '@typescript-eslint/utils':
    dependencies:
      typescript: npm:typescript@6.0.2
  ts-api-utils:
    dependencies:
      typescript: npm:typescript@6.0.2
  typescript-eslint:
    dependencies:
      typescript: npm:typescript@6.0.2

overrides:
  '@typescript-eslint/eslint-plugin>typescript@>=4.8.4 <6.1.0': '-'
  '@typescript-eslint/parser>typescript@>=4.8.4 <6.1.0': '-'
  '@typescript-eslint/project-service>typescript@>=4.8.4 <6.1.0': '-'
  '@typescript-eslint/tsconfig-utils>typescript@>=4.8.4 <6.1.0': '-'
  '@typescript-eslint/type-utils>typescript@>=4.8.4 <6.1.0': '-'
  '@typescript-eslint/typescript-estree>typescript@>=4.8.4 <6.1.0': '-'
  '@typescript-eslint/utils>typescript@>=4.8.4 <6.1.0': '-'
  'ts-api-utils>typescript@>=4.8.4': '-'
  'typescript-eslint>typescript@>=4.8.4 <6.1.0': '-'
